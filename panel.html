<style>
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding:var(--s6) 0 var(--s5)}
.ph h1{font-size:clamp(36px,5vw,54px)}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{padding:18px;border-radius:18px;border:1px solid var(--hair);background:linear-gradient(180deg,rgba(22,22,27,.8),rgba(12,12,15,.8));position:relative;overflow:hidden}
.kpi .ic{color:var(--champ3);width:18px;height:18px;margin-bottom:14px}
.kpi .v{font-family:var(--serif);font-size:34px;line-height:1;color:var(--white);font-variant-numeric:lining-nums tabular-nums}
.kpi .k{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:8px;font-weight:600}
.kpi.main{border-color:var(--hairc)}
.kpi.main::after{content:"";position:absolute;left:18px;bottom:0;width:60px;height:2px;background:var(--stripe);transform:skewX(-35deg)}
.row2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:16px;margin-bottom:16px}
.gauges{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.gauge{text-align:center}
.gauge svg{width:100%;max-width:150px;margin:0 auto}
.gauge .needle{transform-origin:60px 60px;transform-box:view-box;transition:transform 1.2s cubic-bezier(.22,1.2,.36,1)}
.gauge b{display:block;font-size:12.5px;color:var(--white);font-weight:600;margin-top:-6px}
.gauge small{font-size:11px;color:var(--muted)}
.chart svg{width:100%;height:auto}
.chart .bar{transition:height .8s cubic-bezier(.16,1,.3,1),y .8s cubic-bezier(.16,1,.3,1)}
.grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr);gap:16px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-weight:600;color:var(--dim);font-size:10.5px;text-transform:uppercase;letter-spacing:.16em;padding:8px;border-bottom:1px solid var(--hair2);white-space:nowrap}
.tbl td{padding:11px 8px;border-bottom:1px solid var(--hair);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl td b{color:var(--white);font-weight:600}
.tbl input{width:72px;min-height:36px;padding:6px 8px;border-radius:9px;font-size:14px}
.tbl input[type=date]{width:140px}
.tblw{overflow-x:auto;margin:0 -8px;padding:0 8px}
.av{font-family:var(--serif);font-size:20px;color:var(--champ)}
.empty{color:var(--muted);font-size:13.5px;padding:10px 0}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters .chip[aria-pressed=true]{background:rgba(217,201,163,.14);border-color:var(--hairc);color:var(--champ2)}
.filters .search{position:relative;margin-left:auto;flex:1 1 180px;max-width:260px}
.filters .search input{width:100%;min-height:38px;padding:6px 12px 6px 34px;border-radius:var(--r-pill);font-size:14px}
.filters .search .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--dim)}
.log{max-height:640px;overflow-y:auto}
.log .e{font-size:13px;padding:10px 0;border-bottom:1px solid var(--hair);color:var(--silver)}
.log .e small{display:block;color:var(--dim);font-size:11.5px;margin-top:2px}
.mt{margin-top:16px}
.cdt{font-family:var(--mono);font-size:13px;color:var(--champ)}
.acc{border-color:rgba(241,199,102,.4);margin-bottom:16px}
.endm{position:fixed;inset:0;z-index:160;display:grid;place-items:center;background:rgba(0,0,0,.6);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:20px;animation:rise .6s cubic-bezier(.16,1,.3,1)}
.endm .card{max-width:440px;text-align:center;padding:36px 28px}
.endm h2{font-family:var(--serif);font-size:38px;margin:14px 0 8px}
.endm p{color:var(--muted);margin-bottom:22px}
.endm .mono{width:56px;height:56px;font-size:36px;margin:0 auto}
.endm .btns{display:grid;gap:8px}
@media (max-width:1020px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpis .main{grid-column:1/-1}.row2,.grid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){.gauges{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.ph{padding-top:var(--s5)}}
.kpis:empty{min-height:129px}.gauges:empty{min-height:161px}#chart:empty{min-height:160px}
@media (max-width:1020px){.kpis:empty{min-height:411px}}
@media (max-width:520px){.gauges:empty{min-height:340px}#chart:empty{min-height:120px}}
</style>
</head>
<body>
<div id="navw"></div>
<main class="wrap">
  <div class="ph"><div><span class="label">Panel firmy</span><h1>Magazyn na żywo</h1><span class="badge live" style="margin-top:10px">Zmiany z innych kart pojawiają się od razu</span></div>
    <div class="acts"><a class="btn ghost sm" href="zamowienie.html" id="newO"></a><button class="btn ghost sm" id="csv"></button><button class="btn danger sm" id="reset"></button></div></div>
  <section class="kpis" id="kpis" aria-label="Wskaźniki"></section>
  <section class="card acc hidden" id="accWrap"><div class="card-h"><h2>Do akceptacji człowieka</h2><span class="badge warn" id="accN">0</span></div><div class="tblw"><table class="tbl" id="acc"></table></div></section>
  <div class="row2">
    <section class="card" aria-label="Stany — wskaźniki"><div class="card-h"><h2>Dostępne dziś</h2><span class="badge gold">szt.</span></div><div class="gauges" id="gauges"></div></section>
    <section class="card chart" aria-label="Zamówienia dziś według godziny"><div class="card-h"><h2>Zamówienia dziś</h2><span class="badge" id="todayN">0</span></div><div id="chart"></div></section>
  </div>
  <div class="grid">
    <div>
      <section class="card" id="ordCard"><div class="card-h"><h2>Zamówienia</h2></div>
        <div class="filters" id="filters" role="group" aria-label="Filtr statusu"></div>
        <div class="tblw"><table class="tbl" id="ord"></table></div></section>
      <section class="card mt"><div class="card-h"><h2>Stany magazynowe</h2><span class="dim" style="font-size:12px">zmień i zatwierdź Enterem</span></div><div class="tblw"><table class="tbl" id="stock"></table></div></section>
      <section class="card mt"><div class="card-h"><h2>Aktywne rezerwacje</h2><span class="badge gold" id="resN">0</span></div><div class="tblw"><table class="tbl" id="res"></table></div></section>
      <section class="card mt"><div class="card-h"><h2>Płatności</h2><span class="badge test">Test</span></div><div class="tblw"><table class="tbl" id="pay"></table></div></section>
      <section class="card mt"><div class="card-h"><h2>Wydania z Paczkomatu</h2></div><div class="tblw"><table class="tbl" id="pick"></table></div></section>
    </div>
    <section class="card" aria-label="Dziennik zdarzeń"><div class="card-h"><h2>Dziennik zdarzeń</h2></div><div class="log" id="log"></div></section>
  </div>
</main>
<div id="footw"></div>
<script src="firma-engine.js"></script>
<script src="shared.js"></script>
<script>
(() => {
const F = window.JokerFirma, $ = JK.$, I = JK.icon;
JK.mount('panel.html');
const store = F.createStore(window.localStorage);
$('newO').innerHTML = I('arrow') + 'Strona klienta'; $('csv').innerHTML = I('csv') + 'Eksport CSV'; $('reset').innerHTML = I('reset') + 'Resetuj demo';
const t = ms => new Date(ms).toLocaleString('pl-PL', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
const ST = { 'rezerwacja': '<span class="badge gold">rezerwacja</span>', 'akceptacja': '<span class="badge warn">do akceptacji</span>', 'opłacone': '<span class="badge ok">opłacone</span>', 'wydane': '<span class="badge">wydane</span>', 'wygasła': '<span class="badge bad">wygasła</span>', 'odrzucone': '<span class="badge bad">anulowane</span>' };
const FIL = [['all', 'Wszystkie'], ['rezerwacja', 'Rezerwacje'], ['akceptacja', 'Do akceptacji'], ['opłacone', 'Opłacone'], ['wydane', 'Wydane'], ['inne', 'Wygasłe i anulowane']];
let filter = 'all', query = '', editing = false, lastLog = '', lastSig = '';
$('filters').innerHTML = FIL.map(([k, v]) => `<button type="button" class="chip" data-f="${k}" aria-pressed="${k === 'all'}">${v}</button>`).join('') + `<label class="search">${I('search')}<span class="sr">Szukaj</span><input id="q" type="search" placeholder="Szukaj: nr, produkt, klient"></label>`;
$('filters').onclick = e => { const b = e.target.closest('[data-f]'); if (!b) return; filter = b.dataset.f; $('filters').querySelectorAll('[data-f]').forEach(x => x.setAttribute('aria-pressed', String(x === b))); render(true); };
$('q').oninput = e => { query = e.target.value.toLowerCase(); render(true); };
const cd = o => { const s = Math.max(0, Math.ceil((o.expiresAt - Date.now()) / 1000)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
/* obrotomierz */
function gauge(p, av, cap) {
  const A0 = 150, SW = 240, frac = Math.max(0, Math.min(1, av / Math.max(1, cap))), low = av < 20;
  const pt = (a, r) => { const rad = a * Math.PI / 180; return [(60 + r * Math.cos(rad)).toFixed(2), (60 + r * Math.sin(rad)).toFixed(2)]; };
  let ticks = ''; for (let i = 0; i <= 20; i++) { const a = A0 + SW * i / 20, big = i % 5 === 0, [x1, y1] = pt(a, 50), [x2, y2] = pt(a, big ? 43 : 46.5); ticks += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${i <= 2 ? '#ff7a7a' : big ? '#f4ecd8' : '#6b6b75'}" stroke-width="${big ? 1 : .5}"/>`; }
  const arc = (a1, a2, r) => { const [x1, y1] = pt(a1, r), [x2, y2] = pt(a2, r); return `M${x1} ${y1} A${r} ${r} 0 ${a2 - a1 > 180 ? 1 : 0} 1 ${x2} ${y2}`; };
  const ang = A0 + SW * frac;
  return `<div class="gauge${low ? ' low' : ''}" data-p="${p.id}"><svg viewBox="0 0 120 104" role="img" aria-label="${p.name}: ${av} z ${cap} sztuk">
    <circle cx="60" cy="60" r="55" fill="#0b0b0e" stroke="rgba(217,201,163,.35)" stroke-width=".5"/>
    <path d="${arc(A0, A0 + SW, 52.5)}" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="2"/>
    <path d="${arc(A0, Math.max(A0 + .5, ang), 52.5)}" fill="none" stroke="${low ? '#ff7a7a' : '#d9c9a3'}" stroke-width="2" stroke-linecap="round"/>
    ${ticks}
    <text x="60" y="80" text-anchor="middle" font-family="Cormorant Garamond,Georgia,serif" font-size="19" fill="#f5f5f7">${av}</text>
    <text x="60" y="90" text-anchor="middle" font-size="5" letter-spacing="1" fill="#7a7a85" font-family="-apple-system,Inter,sans-serif">Z ${cap}</text>
    <g class="needle" style="transform:rotate(${(ang - 270).toFixed(1)}deg)"><path d="M60 60 L60 14" stroke="${low ? '#ff7a7a' : '#b79cff'}" stroke-width="1" stroke-linecap="round"/><path d="M60 60 L60 68" stroke="#b79cff" stroke-width="2" stroke-linecap="round"/></g>
    <circle cx="60" cy="60" r="3.2" fill="#d9c9a3"/><circle cx="60" cy="60" r="1.2" fill="#0b0b0e"/></svg><b>${p.name.replace('Paleta ', '')}</b><small>${F.zl(p.price)}</small></div>`;
}
function chart(orders) {
  const today = F.iso(new Date()), H = [];
  for (let h = 6; h <= 22; h++) H.push(0);
  orders.filter(o => F.iso(new Date(o.createdAt)) === today).forEach(o => { const h = new Date(o.createdAt).getHours(); const i = Math.min(16, Math.max(0, h - 6)); H[i]++; });
  const max = Math.max(2, ...H), W = 340, Ht = 130, bw = W / H.length;
  $('todayN').textContent = H.reduce((a, b) => a + b, 0);
  let g = ''; for (let i = 0; i <= 2; i++) { const y = 10 + (Ht - 30) * i / 2; g += `<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="rgba(255,255,255,.06)" stroke-width=".5"/>`; }
  const nowH = new Date().getHours();
  H.forEach((v, i) => { const h = (Ht - 30) * v / max, x = i * bw + bw * .22, y = 10 + (Ht - 30) - h; g += `<rect class="bar" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw * .56).toFixed(1)}" height="${Math.max(h, v ? 2 : .6).toFixed(1)}" rx="1.5" fill="${i + 6 === nowH ? 'url(#cg)' : v ? '#8a7a58' : 'rgba(255,255,255,.12)'}"><title>${i + 6}:00 — ${v} zam.</title></rect>`; if (i % 2 === 0) g += `<text x="${(i * bw + bw / 2).toFixed(1)}" y="${Ht - 6}" text-anchor="middle" font-size="8" fill="#7a7a85" font-family="-apple-system,Inter,sans-serif">${i + 6}</text>`; });
  $('chart').innerHTML = `<svg viewBox="0 0 ${W} ${Ht}" role="img" aria-label="Wykres zamówień dziś według godziny"><defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4ecd8"/><stop offset="1" stop-color="#a8956a"/></linearGradient></defs>${g}</svg>`;
}
function match(o) {
  if (filter === 'inne' && !['wygasła', 'odrzucone'].includes(o.status)) return false;
  if (!['all', 'inne'].includes(filter) && o.status !== filter) return false;
  if (query && !(o.no + ' ' + o.name + ' ' + o.customer + ' ' + o.status).toLowerCase().includes(query)) return false;
  return true;
}
function render(force) {
  store.sweep();
  const d = store.get(), today = F.iso(new Date());
  const sig = JSON.stringify([d.orders.map(o => o.status + o.qty), d.products, d.pickups.length, filter, query]);
  const paid = d.payments.reduce((a, p) => a + p.amount, 0), act = d.orders.filter(o => o.status === 'rezerwacja'), acc = d.orders.filter(o => o.status === 'akceptacja');
  if (sig !== lastSig || force) {
    $('kpis').innerHTML = [['coin', 'Przychód (test)', F.zl(paid), 'main'], ['box', 'Zamówienia', d.orders.length], ['clock', 'Rezerwacje', act.length], ['qr', 'Do odbioru', d.orders.filter(o => o.status === 'opłacone').length], ['truck', 'Wydane', d.pickups.length]]
      .map(([ic, k, v, c]) => `<div class="kpi ${c || ''}">${I(ic)}<div class="v num">${v}</div><div class="k">${k}</div></div>`).join('');
    $('gauges').innerHTML = d.products.map(p => gauge(p, store.available(p.id, today), Math.max(p.stock, 1))).join('');
    chart(d.orders);
    $('accWrap').classList.toggle('hidden', !acc.length); $('accN').textContent = acc.length;
    $('acc').innerHTML = '<tr><th>Nr</th><th>Towar</th><th>Termin</th><th>Wartość</th><th></th></tr>' + acc.map(o => `<tr><td><b>${o.no}</b></td><td>${o.qty} × ${o.name}</td><td class="num">${F.short(o.date)} ${o.time}</td><td class="num">${F.zl(o.total)}</td><td style="white-space:nowrap;text-align:right"><button class="btn green sm" data-acc="${o.id}">${I('check')}Akceptuj</button> <button class="btn ghost sm" data-rej="${o.id}">Odrzuć</button></td></tr>`).join('');
    if (!editing) $('stock').innerHTML = '<tr><th>Produkt</th><th>Stan</th><th>Zarezerw.</th><th>Dostępne</th><th>Cena zł</th><th>Dostawa</th><th>Szt.</th></tr>' + d.products.map(p => `<tr data-p="${p.id}"><td><b>${p.name}</b><div class="dim" style="font-size:12px">${p.size}</div></td><td><input type="number" min="0" inputmode="numeric" data-f="stock" value="${p.stock}" aria-label="Stan: ${p.name}"></td><td class="num">${store.held(p.id)}</td><td class="av num">${store.available(p.id, today)}</td><td><input type="number" min="0" step="0.5" inputmode="decimal" data-f="price" value="${p.price}" aria-label="Cena: ${p.name}"></td><td><input type="date" data-f="deliveryDate" value="${p.deliveryDate || ''}" aria-label="Data dostawy: ${p.name}"></td><td><input type="number" min="0" inputmode="numeric" data-f="deliveryQty" value="${p.deliveryQty}" aria-label="Ilość w dostawie: ${p.name}"></td></tr>`).join('');
    const list = d.orders.filter(match);
    $('ord').innerHTML = list.length ? '<tr><th>Nr</th><th>Towar</th><th>Termin</th><th>Kwota</th><th>Status</th><th>Kod</th></tr>' + list.slice(0, 60).map(o => `<tr><td><b>${o.no}</b>${o.flagged ? ' <span title="duże zamówienie" class="badge warn" style="padding:2px 6px">100+</span>' : ''}</td><td>${o.qty} × ${o.name}</td><td class="num">${F.short(o.date)} ${o.time}</td><td class="num">${F.zl(o.total)}</td><td>${ST[o.status] || o.status}</td><td class="num">${o.code ? o.code + ' · skr. ' + o.locker : '—'}</td></tr>`).join('') : `<tr><td class="empty">${d.orders.length ? 'Brak zamówień dla tego filtra.' : 'Brak zamówień. Otwórz <a href="zamowienie.html">stronę klienta</a> i zamów palety.'}</td></tr>`;
    $('pay').innerHTML = d.payments.length ? '<tr><th>ID</th><th>Zamówienie</th><th>Kwota</th><th>Metoda</th><th>Czas</th></tr>' + d.payments.map(p => `<tr><td class="dim">${p.id}</td><td>${p.order}</td><td class="num"><b>${F.zl(p.amount)}</b></td><td>${p.method}</td><td class="num">${t(p.at)}</td></tr>`).join('') : '<tr><td class="empty">Brak płatności.</td></tr>';
    $('pick').innerHTML = d.pickups.length ? '<tr><th>Zamówienie</th><th>Towar</th><th>Skrytka</th><th>Czas</th></tr>' + d.pickups.map(p => `<tr><td>${p.order}</td><td>${p.qty} × ${p.name}</td><td class="num">${p.locker}</td><td class="num">${t(p.at)}</td></tr>`).join('') : '<tr><td class="empty">Nic jeszcze nie wydano.</td></tr>';
    lastSig = sig;
  }
  $('resN').textContent = act.length;
  $('res').innerHTML = act.length ? '<tr><th>Nr</th><th>Towar</th><th>Termin</th><th>Wygasa za</th><th></th></tr>' + act.map(o => `<tr><td><b>${o.no}</b></td><td>${o.qty} × ${o.name}</td><td class="num">${F.short(o.date)} ${o.time}</td><td class="cdt">${cd(o)}</td><td style="white-space:nowrap;text-align:right"><button class="btn ghost sm" data-exp="${o.id}" title="Demo: zakończ czas rezerwacji">Wygaś</button> <button class="btn ghost sm" data-rej="${o.id}">Anuluj</button></td></tr>`).join('') : '<tr><td class="empty">Brak aktywnych rezerwacji.</td></tr>';
  const nl = d.log.length + ':' + (d.log[0] ? d.log[0].at : 0);
  if (nl !== lastLog) { $('log').innerHTML = d.log.slice(0, 80).map(e => `<div class="e">${JK.brand(e.text)}<small class="num">${t(e.at)}</small></div>`).join(''); lastLog = nl; }
}
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.acc) { store.accept(b.dataset.acc); JK.toast('Zaakceptowano — klient widzi płatność.', 'ok'); render(true); }
  if (b.dataset.rej) { store.reject(b.dataset.rej); JK.toast('Anulowano — towar wrócił na stan.', 'info'); render(true); }
  if (b.dataset.exp) { store.expireNow(b.dataset.exp); render(true); }
});
$('stock').addEventListener('focusin', () => editing = true);
$('stock').addEventListener('focusout', () => setTimeout(() => { if (!$('stock').contains(document.activeElement)) { editing = false; render(true); } }, 60));
$('stock').addEventListener('change', e => {
  const i = e.target; if (!i.dataset.f) return; const id = i.closest('tr').dataset.p, f = i.dataset.f;
  const v = f === 'deliveryDate' ? i.value : Math.max(0, +i.value || 0);
  if (f !== 'deliveryDate' && (i.value === '' || +i.value < 0)) { JK.toast('Wpisz liczbę 0 lub większą.', 'err'); return; }
  store.updateProduct(id, { [f]: v }); JK.toast('Zapisano — strona klienta widzi nowy stan.', 'ok');
  const av = i.closest('tr').querySelector('.av'); if (av) av.textContent = store.available(id, F.iso(new Date()));
});
$('stock').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });
$('reset').onclick = () => { if (confirm('Zresetować demo? Zamówienia, płatności i stany wrócą do wartości startowych.')) { store.reset(); editing = false; render(true); JK.toast('Demo zresetowane.', 'ok'); } };
$('csv').onclick = () => {
  const d = store.get(), q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const rows = [['Nr', 'Produkt', 'Ilość', 'Cena jedn.', 'Kwota', 'Data odbioru', 'Godzina', 'Status', 'Kod odbioru', 'Skrytka', 'Klient', 'Utworzono', 'Opłacono', 'Wydano']]
    .concat(d.orders.filter(match).map(o => [o.no, o.name, o.qty, String(o.unit).replace('.', ','), String(o.total).replace('.', ','), o.date, o.time, o.status, o.code || '', o.locker || '', o.customer, t(o.createdAt), o.paidAt ? t(o.paidAt) : '', o.issuedAt ? t(o.issuedAt) : '']));
  const csv = '\ufeff' + rows.map(r => r.map(q).join(';')).join('\r\n');
  JK.download(new Blob([csv], { type: 'text/csv;charset=utf-8' }), `zamowienia-${F.iso(new Date())}.csv`); JK.toast(`Wyeksportowano ${rows.length - 1} zamówień do CSV.`, 'ok');
};
window.__csv = () => $('csv').click();
window.addEventListener('storage', e => { if (e.key === F.KEY) render(true); });
setInterval(() => render(false), 1000);
render(true);
/* pokaz */
async function pokaz() {
  const P = JK.pokaz;
  try {
    P.step(6, 'Firma widzi wszystko na żywo: przychód, rezerwacje, wydania i stan magazynu.'); P.hl($('kpis')); await P.wait(3800);
    P.hl($('gauges')); await P.wait(3000);
    P.hl($('ordCard')); await P.wait(3200); P.hl(null);
    P.step(7, 'Klient zamówił, zapłacił i odebrał — bez jednego telefonu.'); await P.wait(900);
    P.stop(true);
    const m = document.createElement('div'); m.className = 'endm'; m.setAttribute('role', 'dialog'); m.setAttribute('aria-modal', 'true'); m.setAttribute('aria-label', 'Koniec pokazu');
    m.innerHTML = `<div class="card guilloche"><span class="mono" aria-hidden="true">J</span><h2>Bez jednego telefonu.</h2><p>Zamówienie, płatność, bilet, odbiór i raport — w kilkadziesiąt sekund, o każdej porze.</p><div class="btns"><a class="btn primary" href="index.html#dla-firm">${I('phone')}Umów pokaz dla firmy</a><button class="btn ghost" id="again">${I('play')}Powtórz pokaz</button><a class="btn link" href="zamowienie.html">Wypróbuj samodzielnie</a></div></div>`;
    document.body.appendChild(m); m.querySelector('#again').onclick = () => JK.pokaz.start(); m.onclick = e => { if (e.target === m) m.remove(); };
  } catch (e) { }
}
if (JK.pokaz.on && /pokaz=1/.test(location.search)) { history.replaceState(null, '', location.pathname); setTimeout(pokaz, 600); }
else if (JK.pokaz.on) JK.pokaz.stop(true);
})();
</script>
